[project]
name = "kgrag"
version = "0.1.0"
description = "Knowledge-graph + vector RAG over SEC filings, on open-weight models"
requires-python = ">=3.12"
dependencies = [
    "openai>=1.60",        # Fireworks is OpenAI-compatible; no separate SDK needed
    "neo4j>=5.26",
    "pydantic>=2.10",
    "edgartools>=4.0",
    "numpy>=2.0",
    "python-dotenv>=1.0",
    "psycopg[binary]>=3.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.9"]

[project.scripts]
kgrag = "kgrag.run:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kgrag"]

[tool.ruff]
line-length = 100
