name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      # No services: the graph and vector-store tests skip themselves when Neo4j and
      # Postgres are absent, and nothing here calls Fireworks -- embedding scores are
      # injected, so the suite is free, offline and fast by construction.
      - run: uv sync --extra dev
      - run: uv run ruff check .
      - run: uv run pytest -q
